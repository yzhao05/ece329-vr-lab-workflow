[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ece329-lab-design-workflow"
version = "0.1.0"
description = "An agent-guided EMVR workflow for designing ZJUI ECE329 lab proposals."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ZJUI ECE329 Workflow Team"}]
dependencies = ["reportlab>=4.2,<5", "pillow>=10,<13", "jsonschema>=4.23,<5", "pypdf>=5", "python-docx>=1.1,<2"]

[project.optional-dependencies]
harness = ["deepseek-harness-sdk==0.2.1rc2"]
test = ["pytest>=8,<10", "pdfplumber>=0.11,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ece329_workflow = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
